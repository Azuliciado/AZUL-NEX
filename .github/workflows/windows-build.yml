name: Windows build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained app
        run: dotnet publish src/AzulNex/AzulNex.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: iscc installer/AZUL-NEX.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AZUL-NEX-Windows-${{ github.sha }}
          path: |
            artifacts/publish/**
            artifacts/installer/AZUL-NEX-Setup.exe